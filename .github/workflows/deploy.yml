name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/directors-eye
            git pull origin main
            npm run build
            # Sync dist/ to Caddy static root
            rm -rf /var/www/directors-eye/*
            cp -r dist/* /var/www/directors-eye/
            # Restart backend via systemd (Restart=always, no manual pkill/nohup —
            # a prior pkill-by-pattern here self-matched the systemd-managed
            # uvicorn workers too, racing systemd's own restart and sometimes
            # leaving the port unbound until manually reconciled).
            systemctl restart directors-eye
