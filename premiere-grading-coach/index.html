<!DOCTYPE html>
<html>
  <head>
    <script src="index.js"></script>
    <style>
      :root {
        --bg: #1e1e1e;
        --panel: #262626;
        --border: #3a3a3a;
        --text: #d8d8d8;
        --text-dim: #8a8a8a;
        --accent: #2680eb;
        --accent-hover: #4b9eff;
        --radius: 5px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Adobe Clean", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 12px;
        font-size: 12px;
        line-height: 1.4;
      }
      h4 {
        margin: 0 0 14px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      section {
        margin-bottom: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      section:last-of-type {
        border-bottom: none;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-dim);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      button {
        font-family: inherit;
        font-size: 12px;
        color: var(--text);
        background: #3a3a3a;
        border: 1px solid #4a4a4a;
        border-radius: var(--radius);
        padding: 7px 12px;
        cursor: pointer;
        transition: background 0.1s, border-color 0.1s;
      }
      button:hover:not(:disabled) {
        background: #454545;
        border-color: #5a5a5a;
      }
      button:active:not(:disabled) {
        background: #333;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #btnCheckGrade {
        width: 100%;
        padding: 10px;
        font-weight: 600;
        font-size: 13px;
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      #btnCheckGrade:hover:not(:disabled) {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      #refRow {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #refStatus {
        color: var(--text-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #refThumb {
        max-width: 100%;
        max-height: 90px;
        display: none;
        margin-top: 8px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      #liveHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      #liveHeader label {
        margin-bottom: 0;
      }
      .live-switch {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        color: var(--text-dim);
        cursor: pointer;
        text-transform: none;
        letter-spacing: 0;
      }
      #liveNote {
        display: none;
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 4px;
      }
      #liveValues {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
      }
      .value-chip {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 3px 7px;
        font-size: 10.5px;
        color: var(--text);
        white-space: nowrap;
      }
      #zonePanel {
        display: none;
        margin-bottom: 16px;
      }
      #zoneBar {
        display: flex;
        height: 16px;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
      }
      #zoneBar .seg {
        height: 100%;
      }
      #zoneBar .seg-shadow {
        background: #3a4a63;
      }
      #zoneBar .seg-mid {
        background: #6b8ab5;
      }
      #zoneBar .seg-highlight {
        background: #cfe0f0;
      }
      #zoneLegend {
        display: flex;
        justify-content: space-between;
        font-size: 10.5px;
        color: var(--text-dim);
        margin-top: 5px;
      }
      #zoneWarnings {
        font-size: 11px;
        color: #e2a97e;
        margin-top: 6px;
      }
      #zoneWarnings:empty {
        display: none;
      }
      #verdict {
        padding: 10px 12px;
        border-radius: var(--radius);
        margin: 4px 0 16px;
        font-weight: 600;
        display: none;
        border: 1px solid transparent;
      }
      #verdict.achievable {
        background: #123a1f;
        color: #7ee2a0;
        border-color: #1e5c34;
      }
      #verdict.partial {
        background: #3a3212;
        color: #e2c97e;
        border-color: #5c4e1e;
      }
      #verdict.blocked {
        background: #3a1212;
        color: #e27e7e;
        border-color: #5c1e1e;
      }
      #steps {
        list-style: none;
        padding: 0;
        margin: 0 0 16px;
      }
      #steps li {
        padding: 10px 12px;
        margin-bottom: 8px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .step-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .step-tool {
        font-weight: 600;
        color: var(--text);
      }
      .step-current {
        font-size: 10.5px;
        color: var(--text-dim);
        white-space: nowrap;
      }
      .step-direction {
        color: var(--accent-hover);
        margin-top: 2px;
      }
      .step-reason {
        color: var(--text-dim);
        margin-top: 4px;
      }
      #status {
        display: none;
        align-items: center;
        gap: 8px;
        color: var(--text-dim);
        font-size: 11.5px;
        margin: 4px 0 16px;
      }
      #status.visible {
        display: flex;
      }
      #status .spinner {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 2px solid #4a4a4a;
        border-top-color: var(--accent-hover);
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #errorBox {
        display: none;
        white-space: pre-wrap;
        background: #2a1414;
        color: #e2a0a0;
        border: 1px solid #5c1e1e;
        padding: 8px 10px;
        margin: 4px 0 16px;
        border-radius: var(--radius);
        font-size: 11px;
      }
      textarea#visionText {
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        min-height: 44px;
        font-family: inherit;
        font-size: 12px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 7px 9px;
      }
      .btn-row {
        display: flex;
        gap: 8px;
      }
      .btn-row button {
        flex: 1;
      }
      #previewPanel {
        display: none;
        margin-bottom: 16px;
      }
      #previewImages {
        display: flex;
        gap: 8px;
      }
      #previewImages figure {
        flex: 1;
        margin: 0;
      }
      #previewImages img {
        width: 100%;
        display: block;
        border-radius: var(--radius);
        border: 1px solid var(--border);
      }
      #previewImages figcaption {
        font-size: 10.5px;
        color: var(--text-dim);
        text-align: center;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h4>Grading coach</h4>

    <section>
      <div id="liveHeader">
        <label>Live — current frame</label>
        <label class="live-switch">
          <input type="checkbox" id="liveToggle" checked />
          auto
        </label>
      </div>
      <div id="zonePanel">
        <div id="zoneBar">
          <div class="seg seg-shadow" id="segShadow"></div>
          <div class="seg seg-mid" id="segMid"></div>
          <div class="seg seg-highlight" id="segHighlight"></div>
        </div>
        <div id="zoneLegend">
          <span id="legendShadow">Shadows —</span>
          <span id="legendMid">Mids —</span>
          <span id="legendHighlight">Highlights —</span>
        </div>
        <div id="zoneWarnings"></div>
      </div>
      <div id="liveValues"></div>
      <div id="liveNote"></div>
    </section>

    <section>
      <label>Vision (optional)</label>
      <textarea id="visionText" placeholder="Describe the look you want — e.g. warm golden-hour glow, deep filmic blacks, slightly desaturated"></textarea>
      <div id="refRow" style="margin-top: 8px;">
        <button id="btnPickReference">Choose reference image</button>
        <span id="refStatus"></span>
      </div>
      <img id="refThumb" />
    </section>

    <section>
      <div class="btn-row">
        <button id="btnPreview">Preview my target look</button>
        <button id="btnCheckGrade">Check my grade</button>
      </div>
    </section>

    <div id="status"><span class="spinner"></span><span id="statusText"></span></div>
    <div id="errorBox"></div>

    <div id="previewPanel">
      <label>Target look preview</label>
      <div id="previewImages">
        <figure>
          <img id="previewCurrent" />
          <figcaption>Current</figcaption>
        </figure>
        <figure>
          <img id="previewTarget" />
          <figcaption>Target look</figcaption>
        </figure>
      </div>
    </div>

    <div id="verdict"></div>
    <ol id="steps"></ol>
  </body>
</html>
