<!DOCTYPE html>
<html>
  <head>
    <script src="index.js"></script>
    <style>
      :root {
        --bg: #14161a;
        --surface: #1b1e23;
        --surface-raised: #23272e;
        --border: #2d323a;
        --border-soft: #262a31;
        --text: #e6e8eb;
        --text-dim: #868d97;
        --text-faint: #5a616b;
        --accent: #5ab4d6;
        --accent-strong: #8ed4ef;
        --good: #5fbf8a;
        --good-bg: #16241d;
        --good-border: #294a38;
        --warn: #d9a15c;
        --warn-bg: #26200f;
        --warn-border: #4a3c1e;
        --bad: #d97070;
        --bad-bg: #271414;
        --bad-border: #4a2323;
        --radius: 6px;
        --mono: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
        --sans: "Adobe Clean", -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
        padding: 14px;
        font-size: 12px;
        line-height: 1.45;
      }
      h4 {
        margin: 0 0 14px;
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-faint);
      }
      section {
        margin-bottom: 14px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 8px;
      }
      button {
        font-family: var(--sans);
        font-size: 12.5px;
        color: var(--text);
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 12px;
        cursor: pointer;
        transition: background 0.1s, border-color 0.1s;
      }
      button:hover:not(:disabled) {
        background: #2a2f37;
        border-color: #3a4049;
      }
      button:active:not(:disabled) {
        background: #1f232a;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* ---- live scope strip ---- */
      #liveHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0;
      }
      .live-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--text-dim);
      }
      .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 0 3px rgba(95, 191, 138, 0.18);
        animation: pulse 2.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .live-dot {
          animation: none;
        }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      #liveHeader:has(#liveToggle:not(:checked)) .live-dot {
        animation: none;
        opacity: 0.35;
        background: var(--text-faint);
        box-shadow: none;
      }
      .live-switch {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-faint);
        cursor: pointer;
      }
      #liveToggle {
        appearance: none;
        -webkit-appearance: none;
        width: 22px;
        height: 12px;
        border-radius: 6px;
        background: var(--border);
        position: relative;
        cursor: pointer;
        margin: 0;
        transition: background 0.15s;
        flex-shrink: 0;
      }
      #liveToggle::after {
        content: "";
        position: absolute;
        top: 1px;
        left: 1px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #cfd3d8;
        transition: transform 0.15s;
      }
      #liveToggle:checked {
        background: var(--accent);
      }
      #liveToggle:checked::after {
        transform: translateX(10px);
        background: #0b1216;
      }

      .scope {
        background: var(--surface);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 11px 12px;
      }
      #zonePanel {
        display: none;
        margin-top: 10px;
      }
      #zoneBar {
        display: flex;
        height: 26px;
        border-radius: 3px;
        overflow: hidden;
        background: #0e0f11;
        border: 1px solid var(--border-soft);
      }
      #zoneBar .seg {
        height: 100%;
      }
      .seg-shadow {
        background: linear-gradient(180deg, #2a3f52, #1c2c3b);
      }
      .seg-mid {
        background: linear-gradient(180deg, #4f7fa3, #3a648a);
      }
      .seg-highlight {
        background: linear-gradient(180deg, #cfe6f2, #a9d0e3);
      }
      #zoneLegend {
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 10px;
        color: var(--text-dim);
        margin-top: 6px;
      }
      #zoneWarnings {
        font-size: 11px;
        color: var(--warn);
        margin-top: 6px;
      }
      #zoneWarnings:empty {
        display: none;
      }
      #liveValues {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .value-chip {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 10.5px;
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 4px 8px;
        color: var(--text-dim);
        white-space: nowrap;
      }
      #liveNote {
        display: none;
        font-size: 11px;
        color: var(--text-faint);
        margin-top: 8px;
      }

      /* ---- target card (vision + reference) ---- */
      .target-card {
        background: var(--surface);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        padding: 12px;
      }
      textarea#visionText {
        width: 100%;
        box-sizing: border-box;
        resize: vertical;
        min-height: 46px;
        font-family: var(--sans);
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--text);
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 9px 10px;
      }
      textarea#visionText::placeholder {
        color: var(--text-faint);
      }
      #refRow {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      #refStatus {
        color: var(--text-faint);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #refThumb {
        max-width: 100%;
        max-height: 90px;
        display: none;
        margin-top: 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      /* ---- actions ---- */
      .btn-row {
        display: flex;
        gap: 8px;
      }
      .btn-row button {
        flex: 1;
        font-weight: 600;
        padding: 10px 12px;
      }
      #btnPreview {
        background: var(--surface-raised);
      }
      #btnCheckGrade {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1216;
      }
      #btnCheckGrade:hover:not(:disabled) {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }

      #status {
        display: none;
        align-items: center;
        gap: 8px;
        color: var(--text-dim);
        font-size: 11.5px;
        margin-top: 10px;
      }
      #status.visible {
        display: flex;
      }
      #status .spinner {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 2px solid var(--border);
        border-top-color: var(--accent-strong);
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #errorBox {
        display: none;
        white-space: pre-wrap;
        background: var(--bad-bg);
        color: #e2a0a0;
        border: 1px solid var(--bad-border);
        padding: 8px 10px;
        margin-top: 10px;
        border-radius: var(--radius);
        font-size: 11px;
      }

      /* ---- preview compare ---- */
      #previewPanel {
        display: none;
      }
      #previewImages {
        display: flex;
        gap: 8px;
      }
      #previewImages figure {
        flex: 1;
        margin: 0;
      }
      #previewImages img {
        width: 100%;
        display: block;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--surface-raised);
      }
      #previewImages figcaption {
        font-family: var(--mono);
        font-size: 9.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-faint);
        text-align: center;
        margin-top: 6px;
      }

      /* ---- verdict ---- */
      #verdict {
        display: none;
        align-items: flex-start;
        gap: 9px;
        padding: 11px 13px;
        border-radius: var(--radius);
        border: 1px solid transparent;
      }
      #verdict.achievable {
        display: flex;
        background: var(--good-bg);
        border-color: var(--good-border);
      }
      #verdict.partial {
        display: flex;
        background: var(--warn-bg);
        border-color: var(--warn-border);
      }
      #verdict.blocked {
        display: flex;
        background: var(--bad-bg);
        border-color: var(--bad-border);
      }
      #verdict::before {
        content: "";
        width: 3px;
        align-self: stretch;
        border-radius: 2px;
        background: currentColor;
      }
      #verdict.achievable { color: var(--good); }
      #verdict.partial { color: var(--warn); }
      #verdict.blocked { color: var(--bad); }
      #verdictText {
        color: var(--text);
        font-size: 12px;
      }

      /* ---- steps as a numbered call sheet ---- */
      #steps {
        list-style: none;
        padding: 0;
        margin: 0;
        counter-reset: step;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      #steps li {
        counter-increment: step;
        position: relative;
        padding: 10px 12px 10px 32px;
        background: var(--surface);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
      }
      #steps li::before {
        content: counter(step);
        position: absolute;
        left: 12px;
        top: 11px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-faint);
      }
      .step-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .step-tool {
        font-weight: 600;
        color: var(--text);
        font-size: 12.5px;
      }
      .step-current {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 10px;
        color: var(--text-faint);
        white-space: nowrap;
      }
      .step-direction {
        color: var(--accent-strong);
        font-weight: 500;
        margin-top: 3px;
        font-size: 12px;
      }
      .step-reason {
        color: var(--text-dim);
        margin-top: 4px;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <h4>Grading Coach</h4>

    <section>
      <div id="liveHeader">
        <span class="live-label"><span class="live-dot"></span>Live — current frame</span>
        <label class="live-switch">
          <input type="checkbox" id="liveToggle" checked />
          auto
        </label>
      </div>
      <div class="scope">
        <div id="zonePanel">
          <div id="zoneBar">
            <div class="seg seg-shadow" id="segShadow"></div>
            <div class="seg seg-mid" id="segMid"></div>
            <div class="seg seg-highlight" id="segHighlight"></div>
          </div>
          <div id="zoneLegend">
            <span id="legendShadow">Shadows —</span>
            <span id="legendMid">Mids —</span>
            <span id="legendHighlight">Highlights —</span>
          </div>
          <div id="zoneWarnings"></div>
        </div>
        <div id="liveValues"></div>
        <div id="liveNote"></div>
      </div>
    </section>

    <section>
      <span class="eyebrow">Your vision</span>
      <div class="target-card">
        <textarea id="visionText" placeholder="Describe the look you want — e.g. warm golden-hour glow, deep filmic blacks, slightly desaturated"></textarea>
        <div id="refRow">
          <button id="btnPickReference">Choose reference image</button>
          <span id="refStatus"></span>
        </div>
        <img id="refThumb" />
      </div>
    </section>

    <section>
      <div class="btn-row">
        <button id="btnPreview">Preview look</button>
        <button id="btnCheckGrade">Check my grade</button>
      </div>
      <div id="status"><span class="spinner"></span><span id="statusText"></span></div>
      <div id="errorBox"></div>
    </section>

    <section id="previewPanel">
      <span class="eyebrow">Target look preview</span>
      <div id="previewImages">
        <figure>
          <img id="previewCurrent" />
          <figcaption>Current</figcaption>
        </figure>
        <figure>
          <img id="previewTarget" />
          <figcaption>Target look</figcaption>
        </figure>
      </div>
    </section>

    <section>
      <div id="verdict"><span id="verdictText"></span></div>
    </section>

    <section>
      <ol id="steps"></ol>
    </section>
  </body>
</html>
